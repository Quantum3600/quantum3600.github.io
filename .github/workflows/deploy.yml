name: Deploy Kobweb Site to GitHub Pages

on:
  push:
    branches:
      - master  # Change to 'master' if your default branch is named master

# Grant GITHUB_TOKEN the required permissions to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, canceling queued runs
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Kobweb CLI
        uses: varabyte/kobweb-cli-setup-action@v1

      - name: Export Kobweb Site
        run: kobweb export --layout static

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.kobweb/site/processedResources'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
