name: Deploy Kobweb Site to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      # Install Playwright Chromium so Kobweb can snapshot @Page composables
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Export Kobweb static site via Gradle
      - name: Export Kobweb Site
        run: ./gradlew :site:kobwebExport -PkobwebExportLayout=STATIC --stacktrace

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the exported static site directly from .kobweb/site
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.kobweb/site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
