<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="round">
      <circle cx="64" cy="64" r="64" />
    </clipPath>
  </defs>
  <!-- optional white background to avoid transparency artifacts -->
  <rect width="128" height="128" fill="#ffffff" clip-path="url(#round)" />
  <image href="photo.webp" width="128" height="128" preserveAspectRatio="xMidYMid slice" clip-path="url(#round)" />
</svg>
